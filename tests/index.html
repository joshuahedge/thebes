<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Thebes tests</title>
<style>
  body { font: 14px/1.5 ui-monospace, Consolas, monospace; margin: 16px; background: #fff; color: #111; }
  #results { white-space: pre-wrap; }
</style>
</head>
<body>
<pre id="results">RUNNING</pre>
<script>window.__thebesRigDevice = true;   // Version 8.0: the test page follows the browser's Reduce motion as 7.x did (src/ui/settings.js); the game itself never does</script>
<script type="module">
  const out = document.getElementById('results');
  try {
    const { run } = await import('./harness.js');
    await import('./all.js');
    const grep = new URLSearchParams(location.search).get('grep') || '';
    await run(grep);
  } catch (e) {
    out.textContent = 'LOAD ERROR\n' + (e && e.stack ? e.stack : String(e));
    document.title = 'FAIL';
  }
  // Hand the result text to tests/serve.py, which the command-line runner polls. Opening the page by
  // hand still shows it above, and a failed POST (another server, no server) is ignored.
  try { await fetch('/__results', { method: 'POST', body: out.textContent }); } catch (e) { /* ignore */ }
</script>
</body>
</html>
