<script>
/* The loading screen (Version 9.1, Track R, design 5a): painted from the page's own head, so a slow connection sees the name and a quiet line at once; boot.js removes it when the
   title shows (window.__v91Loading.done). After 15 s it says so and offers Reload; a failed file (the early-error block, below) says so too. Plain old script: it must run anywhere. */
(function () {
  var w = window, d = document, node = null, finished = false, timer = null, state = { slow: false, fail: '', old: false };
  function paint() {
    if (!node) build();
    if (!node) return;
    var p = node.getElementsByTagName('p'), button = node.getElementsByTagName('button')[0], bad = Boolean(state.fail), line = p[1], slow = p[2], fail = p[3], old = p[4];
    line.hidden = bad || state.old;
    slow.hidden = !state.slow || bad || state.old;
    fail.hidden = !bad;
    fail.textContent = bad ? 'Thebes could not start (' + state.fail.slice(0, 160) + '). Check your connection, then Reload.' : '';
    old.hidden = !state.old;
    button.hidden = state.old || !(state.slow || bad);
  }
  function build() {
    if (node || finished || !d.body) return;
    node = d.createElement('div');
    node.id = 'v91-loading';
    node.setAttribute('role', 'status');
    node.innerHTML = '<p class="v91-name">Thebes</p><p class="v91-line">Loading</p><p class="v91-slow" hidden>Still loading. Slow connection?</p><p class="v91-fail" hidden></p><p class="v91-old" hidden>This browser is too old to run Thebes. Try a current Safari, Chrome, Edge or Firefox.</p><button type="button" hidden>Reload</button>';
    node.getElementsByTagName('button')[0].onclick = function () { w.location.reload(); };
    d.body.appendChild(node);
    paint();
  }

    active: function () { return !finished; },
    slow: function () { state.slow = true; paint(); },
    fail: function (msg) { state.fail = String(msg || 'an error'); paint(); },
    old: function () { state.old = true; paint(); },
    done: function () { finished = true; if (timer !== null) clearTimeout(timer); if (node && node.parentNode) node.parentNode.removeChild(node); node = null; }
  };
  timer = setTimeout(function () { timer = null; w.__v91Loading.slow(); }, 15000);

<script>
/* The early error line (Version 9.1, Track R, design 5a): a module that fails to load (a missing file, a lost connection, a syntax error) or a start that throws before the title
   shows is said on the loading screen with Reload, instead of a blank page. Capture phase: a failed script element's error does not bubble. After the title shows it does nothing. */
(function () {
  var w = window;
  /* Not failures of the start (the same list as src/ui/v91/rescue.js ignorable; keep the two alike): the browser's ResizeObserver notice, the cross-origin "Script error.", a
     cancelled share or a blocked sound (AbortError, NotAllowedError), a rejection with no reason. */
  function ignore(err, message) {
    var text = (message || '') + ' ' + (err && err.message ? err.message : '');
    if (/ResizeObserver loop|^\s*Script error\.?\s*$/.test(text)) return true;
    if (err === undefined || err === null) return !message;
    return err.name === 'AbortError' || err.name === 'NotAllowedError';
  }
  function say(msg) { var L = w.__v91Loading; if (L && L.active()) L.fail(msg); }
  w.addEventListener('error', function (e) {
    var t = e && e.target;
    if (t && t !== w && t.tagName) { if (t.tagName === 'SCRIPT') say('a file did not load'); return; }
    if (ignore(e && e.error, e && e.message)) return;
    say((e && e.message) || 'an error');
  }, true);
  w.addEventListener('unhandledrejection', function (e) { var r = e && e.reason; if (ignore(r, '')) return; say((r && r.message) || 'an error'); });
})();
</script>
