<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3E7CB">
<meta name="description" content="A city builder for phone and desktop browsers, inspired by the classic Egyptian city builders.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Thebes">
<meta property="og:type" content="website">
<meta property="og:title" content="Thebes">
<meta property="og:description" content="A city builder for phone and desktop browsers, inspired by the classic Egyptian city builders.">
<meta property="og:url" content="https://joshuahedge.github.io/thebes/">
<meta property="og:image" content="https://joshuahedge.github.io/thebes/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<title>Thebes</title>
<link rel="stylesheet" href="./css/ui.css">
<link rel="stylesheet" href="./css/v80-u.css">
</head>
<body data-layout="portrait" data-input="touch" data-hand="right" data-text-size="100">
<canvas id="map" role="img" aria-label="City map" aria-describedby="map-summary" tabindex="-1"></canvas>
<div id="ui">
  <header id="topbar" aria-label="City status"></header>
  <div id="under-bar">
    <div id="notice" role="region" aria-label="Notice" hidden></div>
    <div id="banner" role="region" aria-label="Critical alerts"></div>
    <div id="legend" role="region" aria-label="Overlay legend"></div>
    <div id="goals" role="region" aria-label="Goals"></div>
    <div id="tip" role="status" aria-live="polite"></div>
    <div id="cheer" role="status" aria-live="polite"></div>
  </div>
  <aside id="panel" aria-label="Build panel"></aside>
  <aside id="rail" aria-label="Build rail"></aside>
  <div id="corners"></div>
  <nav id="dock" aria-label="Build dock"></nav>
  <section id="sheet" aria-label="Details" hidden></section>
  <div id="toasts" role="status" aria-live="polite"></div>
  <div id="dialog" role="dialog" aria-modal="true" hidden></div>
  <p id="live" class="sr-only" aria-live="polite"></p>
  <p id="map-summary" class="sr-only"></p>
  <div id="title" hidden></div>
</div>
<noscript><p class="noscript">Thebes needs JavaScript to run.</p></noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
