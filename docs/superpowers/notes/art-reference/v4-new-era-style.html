<script>
const T=16,H=8;
const p=(x,y)=>[(x-y)*T,(x+y)*H];
const f=n=>Math.round(n*10)/10;
const M=q=>f(q[0])+','+f(q[1]);
const P=a=>a.map(M).join(' ');
const U=(q,h)=>[q[0],q[1]-h];
const hs=(x,y,k)=>{const s=Math.sin(x*12.9898+y*78.233+k*37.719)*43758.5453;return s-Math.floor(s)};
let o=[],SH=[],OB=[];
const op=a=>' fill-opacity="'+a+'"',so=a=>' stroke-opacity="'+a+'"';
const OL=' stroke="#5A4A6A" stroke-opacity="0.32" stroke-width="0.6" stroke-linejoin="round"';
const poly=(a,c,ex)=>o.push('<polygon points="'+P(a)+'" fill="'+c+'"'+(ex||'')+'/>');
const ln=(a,b,c,w,ex)=>o.push('<line x1="'+f(a[0])+'" y1="'+f(a[1])+'" x2="'+f(b[0])+'" y2="'+f(b[1])+'" stroke="'+c+'" stroke-width="'+f(w||1)+'" stroke-linecap="round"'+(ex||'')+'/>');
const circ=(q,r,c,ex)=>o.push('<circle cx="'+f(q[0])+'" cy="'+f(q[1])+'" r="'+f(r)+'" fill="'+c+'"'+(ex||'')+'/>');
const ell=(q,rx,ry,c,ex)=>o.push('<ellipse cx="'+f(q[0])+'" cy="'+f(q[1])+'" rx="'+f(rx)+'" ry="'+f(ry)+'" fill="'+c+'"'+(ex||'')+'/>');
const pth=(d,c,ex)=>o.push('<path d="'+d+'" fill="'+c+'"'+(ex||'')+'/>');
const tile=(x,y,c,ex)=>poly([p(x,y),p(x+1,y),p(x+1,y+1),p(x,y+1)],c,ex);
const dia=(cx,cy,r)=>[p(cx,cy-r),p(cx+r,cy),p(cx,cy+r),p(cx-r,cy)];
const quad=(x,y,w,d,z)=>[U(p(x,y),z),U(p(x+w,y),z),U(p(x+w,y+d),z),U(p(x,y+d),z)];
const WASH=['#FAF5EC','#EFE6D9','#C9BCCD'],WASH2=['#F6EFE3','#E9DED0','#C1B3C6'],MUD=['#DCB57E','#CB9F66','#A08274'],MUD2=['#E0BC88','#CFA670','#A68A78'],STONE=['#F4EDDF','#E7DDCC','#C3B8C6'],SST=['#ECD9AC','#D9C495','#B0A09E'],ROCK=['#D3B582','#B99565','#8E7470'],GOLDC=['#F6D46A','#E2B13C','#B98A4A'],LIME=['#F6EFDF','#EBE1CE','#CBBFCB'];
const TEAL='#2E8C83',BLUE='#2F6FA8',RED='#C4473A',GOLD='#E2B13C',PINK='#D9667A',ORANGE='#E07B39',GREEN='#5E9E4A',PURP='#7A5AA0',WOOD='#6B4A3A',LEAF='#4F8A2E',LEAF2='#6AA83A',LEAF3='#3F7526';
function tb(x,y,w,d,h,z,i,C,fx){const L=(u,s)=>{const k=i*s/h;return U(p(x+k+(w-2*k)*u,y+d-k),z+s)};const R=(u,s)=>{const k=i*s/h;return U(p(x+w-k,y+k+(d-2*k)*u),z+s)};const e=fx===0?'':OL;const lf=[L(0,0),L(1,0),L(1,h),L(0,h)],rf=[R(0,0),R(1,0),R(1,h),R(0,h)];
poly(lf,C[1],e);if(fx!==0)poly(lf,'url(#fg)');poly(rf,C[2],e);if(fx!==0)poly(rf,'url(#fg)');if(w-2*i>.001&&d-2*i>.001)poly([U(p(x+i,y+i),z+h),U(p(x+w-i,y+i),z+h),U(p(x+w-i,y+d-i),z+h),U(p(x+i,y+d-i),z+h)],C[0],e);
if(fx!==0){if(z===0){ln(L(0,0),L(1,0),'#3A2E5A',1.1,so(.25));ln(R(0,0),R(1,0),'#3A2E5A',1.1,so(.25));}ln(L(0,h),L(1,h),'#FFFFFF',.7,so(.6));ln(R(0,h),R(1,h),'#FFFFFF',.6,so(.3));}return {L,R};}
const box=(x,y,w,d,h,z,C,fx)=>tb(x,y,w,d,h,z,0,C,fx);
const qd=(F,u0,u1,s0,s1,c,ex)=>poly([F(u0,s0),F(u1,s0),F(u1,s1),F(u0,s1)],c,ex);
const crs=(F,h,c,st)=>{st=st||3;for(let s=st;s<h-.5;s+=st){ln(F.L(0,s),F.L(1,s),c,.45,so(.3));ln(F.R(0,s),F.R(1,s),c,.45,so(.3));}};
const door=(F,u0,u1,h)=>{qd(F.L,u0-.05,u1+.05,h,h+1,'#FFFFFF',op(.6));qd(F.L,u0,u1,0,h,'#3E3040');};
const win=(S,u0,u1,s0,s1)=>{qd(S,u0,u1,s0,s1,'#4A3C4E');ln(S(u0-.02,s0),S(u1+.02,s0),'#FFFFFF',.6,so(.7));};
const parapet=(a,b,w,d,h)=>poly(quad(a+.06,b+.06,w-.12,d-.12,h),'#ECE2D2');
const shd=(x,y,w,d,h)=>SH.push([x,y,w,d,h]);const add=(k,fn)=>OB.push([k,fn]);
const mat=(x,y,w,d,z,c1,c2)=>{poly(quad(x,y,w,d,z),c1);if(c2)poly(quad(x+w*.3,y+d*.3,w*.4,d*.4,z),c2);};
const rug=(x,y,w,d,z,c1,c2,c3)=>{poly(quad(x,y,w,d,z),c1,' stroke="'+c2+'" stroke-width="0.8"');[[.3,c2],[.5,c3],[.7,c2]].forEach(([v,c])=>ln(U(p(x+.04,y+d*v),z),U(p(x+w-.04,y+d*v),z),c,.8));};
const pots=(q,n)=>{for(let i=0;i<n;i++){const c=[q[0]+i*2.8-(n-1)*1.4,q[1]+(i%2)*.8];ell(U(c,1.5),1.6,1.6,'#C9552F',OL);ell(U([c[0]-.5,c[1]],2.1),.45,.55,'#F6B48A',op(.75));}};
const fence=(x,y,w,d)=>{const F=box(x,y,w,d,3,0,['#DDB872','#CCA463','#A48474'],0);for(let u=.06;u<1;u+=.1){ln(F.L(u,0),F.L(u,3),'#9C7A3A',.35);ln(F.R(u,0),F.R(u,3),'#8A6A4A',.35);}};
const stairs=(x,y,len,dep,hT,n,C)=>{for(let i=0;i<n;i++)box(x+i*len/n,y,len/n,dep,hT*(i+1)/n,0,C,0);};
const ladder=(a,b)=>{ln([a[0]-1.1,a[1]],[b[0]-1.1,b[1]],WOOD,.6);ln([a[0]+1.1,a[1]],[b[0]+1.1,b[1]],WOOD,.6);const n=Math.max(2,Math.floor(Math.abs(a[1]-b[1])/2));for(let i=1;i<n;i++){const t=i/n;ln([a[0]-1.1+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t],[a[0]+1.1+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t],WOOD,.45);}};
const post=(gx,gy,z,h)=>{const q=U(p(gx,gy),z);ln(q,U(q,h),WOOD,.7);};
const awn=(x,y,w,d,z,c1,c2,st)=>{[[x+.04,y+d-.04],[x+w-.04,y+d-.04],[x+w-.04,y+.04]].forEach(([a,b])=>post(a,b,z-4.2,4.2));const A=tb(x,y,w,d,1.2,z,.05,[c1,c2,c2],0);for(let u=.1;u<.95;u+=.25){qd(A.L,u,u+.12,0,1.2,st||'#F6ECD6',op(.85));qd(A.R,u,u+.12,0,1.2,st||'#F6ECD6',op(.6));}poly(quad(x+.05,y+.05,w-.1,d-.1,z+1.2),st||'#F6ECD6',op(.25));};
const col=(gx,gy,h,z,cap)=>{const F=box(gx-.05,gy-.05,.1,.1,h,z,STONE,0);[[h*.25,h*.32],[h-2.4,h-1.7]].forEach(([a,b])=>{qd(F.L,0,1,a,b,TEAL);qd(F.R,0,1,a,b,'#22685F');});tb(gx-.06,gy-.06,.12,.12,1.6,z+h,-.035,cap||['#8FC07A','#5E9E4A','#3E7A36'],0);};
const bed=(x,y,w,d)=>{poly(quad(x,y,w,d,0),'#6FA243',' stroke="#C9B48A" stroke-width="1.1"');for(let i=0;i<7;i++){const q=p(x+w*(.15+.7*hs(x,i,1)),y+d*(.15+.7*hs(y,i,2)));circ(U(q,1.4),1.6,'#4F8A2E');circ(U(q,2.5),.75,[RED,GOLD,'#FFFFFF',PURP,PINK][i%5]);}};
const pool=(x,y,w,d)=>{poly(quad(x-.05,y-.05,w+.1,d+.1,0),'#F2E6CC');poly(quad(x,y,w,d,0),'#4FB3B5');poly(quad(x+.04,y+.04,w-.08,d*.35,0),'#7FD0CC',op(.6));ln(p(x+w*.25,y+d*.6),p(x+w*.6,y+d*.6),'#D7F0EE',.7);};
const statue=(gx,gy)=>{box(gx-.09,gy-.09,.18,.18,3.2,0,STONE,0);box(gx-.035,gy-.035,.07,.07,5.5,3.2,GOLDC,0);circ(U(p(gx,gy),9.8),1.15,GOLD);};
function palmAt(gx,gy,sc,z){z=z||0;const c=U(p(gx,gy),z);ell([c[0]+5*sc,c[1]],8*sc,2.8*sc,'#3E3260',op(.14));const t=[c[0]+3*sc,c[1]-20*sc],c1=[c[0]-2*sc,c[1]-10*sc];pth('M'+M([c[0]-1.3*sc,c[1]])+' Q'+M([c1[0]-.8*sc,c1[1]])+' '+M([t[0]-.9*sc,t[1]])+' L'+M([t[0]+.9*sc,t[1]])+' Q'+M([c1[0]+.8*sc,c1[1]])+' '+M([c[0]+1.3*sc,c[1]])+' Z','#9A7448');
for(let s=.12;s<.95;s+=.11){const a=(1-s)*(1-s),b=2*(1-s)*s,d=s*s,bx=a*c[0]+b*c1[0]+d*t[0],by=a*c[1]+b*c1[1]+d*t[1];ln([bx-1.1*sc,by],[bx+1.1*sc,by+.4*sc],'#6E5236',.5*sc);}
[[-165,LEAF3,1],[-128,LEAF,1.05],[-92,LEAF2,.75],[-55,LEAF,1.05],[-15,LEAF3,1],[25,LEAF2,.95],[155,LEAF2,.95],[118,LEAF,.85],[72,LEAF3,.8]].forEach(([a,cl,L])=>{const ca=Math.cos(a*Math.PI/180),sa=Math.sin(a*Math.PI/180),len=11*sc*L,e=[t[0]+ca*len,t[1]+sa*len*.5+4*sc*Math.abs(ca)],m=[t[0]+ca*len*.55,t[1]+sa*len*.3-2.2*sc],nx=-sa*1.1*sc,ny=ca*1.9*sc;pth('M'+M(t)+' Q'+M([m[0]+nx,m[1]+ny])+' '+M(e)+' Q'+M([m[0]-nx,m[1]-ny])+' '+M(t)+' Z',cl);o.push('<path d="M'+M(t)+' Q'+M(m)+' '+M(e)+'" fill="none" stroke="#2C5A1E" stroke-width="'+f(.5*sc)+'" stroke-opacity="0.5"/>');});circ([t[0]-.9*sc,t[1]+1.5*sc],1.1*sc,'#6B4A2A');circ([t[0]+1.1*sc,t[1]+1.7*sc],1.1*sc,'#6B4A2A');}
const palm=(gx,gy)=>add(gx+gy,()=>palmAt(gx,gy,1));
const acacia=(gx,gy)=>add(gx+gy,()=>{const c=p(gx,gy);ell([c[0]+7,c[1]+1],12,3.5,'#3E3260',op(.13));o.push('<path d="M'+M(c)+' L'+M([c[0]+.5,c[1]-7])+' L'+M([c[0]-5,c[1]-12])+' M'+M([c[0]+.5,c[1]-7])+' L'+M([c[0]+6,c[1]-12.5])+'" fill="none" stroke="#6B4F3A" stroke-width="1.4" stroke-linecap="round"/>');ell([c[0],c[1]-13.5],12,3.6,'#4F7E2E');ell([c[0]-1,c[1]-14.6],10,2.8,'#62963A');ell([c[0]+2,c[1]-15.3],6,1.8,'#86B64E');});
const reeds=q=>{for(let i=0;i<5;i++){const dx=(i-2)*1.2,hh=5+hs(q[0],q[1],i)*4;ln([q[0]+dx,q[1]],[q[0]+dx*1.6,q[1]-hh],i%2?'#4F8A2E':'#6AA83A',.8);if(i%2===0)ell([q[0]+dx*1.6,q[1]-hh-1],1.1,1.8,'#9CC45A');}};
const rock=c=>{poly([[c[0]-4,c[1]],[c[0]-2.4,c[1]-3],[c[0]+1.8,c[1]-3.6],[c[0]+4.4,c[1]-1],[c[0]+3,c[1]+1.4],[c[0]-2,c[1]+1.5]],'#B39C82',OL);poly([[c[0]-2.2,c[1]-2.6],[c[0]+1.8,c[1]-3.2],[c[0]+3,c[1]-1.4],[c[0]-1,c[1]-1]],'#D9C7A8');};
const scrub=c=>{ell([c[0]+3,c[1]+.5],5,1.5,'#3E3260',op(.1));circ([c[0]-2,c[1]-1.2],2.4,'#5E8A34');circ([c[0]+1.5,c[1]-2.2],2.6,'#72A040');circ([c[0]+.4,c[1]-.2],2,'#4F7A2C');circ([c[0]+1,c[1]-3],1,'#9CC45A');};
const dune=c=>{pth('M'+M([c[0]-9,c[1]+1])+' q9,-4.5 18,0','none',' stroke="#F7EAC8" stroke-width="1" stroke-opacity="0.85"');pth('M'+M([c[0]-8,c[1]+2.2])+' q8,-3.6 16,0','none',' stroke="#CDB283" stroke-width="0.8" stroke-opacity="0.45"');};
const tufts=(x,y,n)=>{for(let j=0;j<n;j++){const q=p(x+hs(x,y,60+j),y+hs(x,y,70+j));ln(q,[q[0]-.8,q[1]-3],'#4F7A2C',.7);ln(q,[q[0]+.6,q[1]-3.4],'#A6CC5E',.6);ln(q,[q[0]+1.4,q[1]-2.2],'#6E9E3A',.6);}};
const grassTile=(x,y)=>{tile(x,y,hs(x,y,9)<.5?'#86AE45':'#8FB64C');tufts(x,y,9);};
const mosaic=(x,y,k)=>{const C={a:['#F3DDB2','#C4473A','#D9667A','#2E8C83'],b:['#D7E8D0','#2E8C83','#5E9E4A','#E2B13C'],c:['#E9F0F4','#2F6FA8','#8FB6DA','#E2B13C']}[k];tile(x,y,C[0],' stroke="'+C[1]+'" stroke-width="1"');poly(dia(x+.5,y+.5,.36),'none',' stroke="'+C[2]+'" stroke-width="1.2"');poly(dia(x+.5,y+.5,.18),C[1]);circ(p(x+.5,y+.5),1.4,C[3]);[[.12,.5],[.88,.5],[.5,.12],[.5,.88]].forEach(([u,v])=>circ(p(x+u,y+v),.9,C[3]));};
const checker=(x,y)=>{for(let i=0;i<2;i++)for(let j=0;j<2;j++)poly([p(x+i*.5,y+j*.5),p(x+i*.5+.5,y+j*.5),p(x+i*.5+.5,y+j*.5+.5),p(x+i*.5,y+j*.5+.5)],(i+j)%2?'#5C8FC0':'#EDF2F5');poly(dia(x+.5,y+.5,.16),GOLD);};
function H1(x,y){const a=x+.22,b=y+.22,w=.56;shd(a,b,w,w,9);add(x+y+1,()=>{const F=box(a,b,w,w,5.5,0,MUD);crs(F,5.5,'#9C7A54',2.2);qd(F.L,.36,.62,0,3.8,'#4A3218');for(let u=.39;u<.6;u+=.055)ln(F.L(u,0),F.L(u,3.8),'#B08C50',.4,so(.8));const R=tb(a-.07,b-.07,w+.14,w+.14,5.5,5.5,.36,['#E9CB82','#D8B366','#AC9070']);for(let u=.08;u<.95;u+=.14){ln(R.L(u,0),R.L(.5+(u-.5)*.25,4.8),'#AC8840',.4,so(.7));ln(R.R(u,0),R.R(.5+(u-.5)*.25,4.8),'#8E7058',.4,so(.7));}fence(x+.06,y+.86,.6,.07);pots(p(x+.86,y+.6),1);});}
function H2(x,y){const a=x+.14,b=y+.14,w=.66;shd(a,b,w,w,10);add(x+y+1,()=>{const F=box(a,b,w,w,7,0,MUD2);crs(F,7,'#9C7A54',2.3);door(F,.36,.6,4.4);win(F.R,.35,.55,3.5,5.2);box(a-.03,b-.03,w+.06,w+.06,.8,7,['#D8BC84','#BEA064','#A08878'],0);for(let u=.12;u<1;u+=.16)ln(U(p(a+u*w,b),7.8),U(p(a+u*w,b+w),7.8),'#B49660',.5,so(.8));mat(a+.12,b+.15,.3,.3,7.85,PINK,null);pots(p(x+.9,y+.5),2);});}
